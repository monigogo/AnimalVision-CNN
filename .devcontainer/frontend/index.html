<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱🐶 Detector de Mascotas</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐱🐶 Detector de Mascotas</h1>
            <p>Clasificación en tiempo real con IA</p>
        </header>

        <main>
            <!-- Video de la cámara -->
            <div class="video-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>

            <!-- Resultado -->
            <div class="result-box" id="result">
                <div class="emoji" id="emoji">📷</div>
                <h2 id="prediction">Presiona "Iniciar Cámara"</h2>
                <div class="confidence" id="confidence"></div>
            </div>

            <!-- Controles -->
            <div class="controls">
                <button id="startBtn" class="btn btn-primary">📹 Iniciar Cámara</button>
                <button id="stopBtn" class="btn btn-secondary" disabled>⏹️ Detener</button>
                <label for="imageUpload" class="btn btn-upload">📁 Cargar Imagen</label>
                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            </div>

            <!-- Indicador de carga -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Cargando...</p>
            </div>
        </main>

        <footer>
            <p>CNN desarrollada con TensorFlow</p>
        </footer>
    </div>

    <script src="src/app.js"></script>
</body>
</html>
